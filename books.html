<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="accaza-books-build" content="3"/>
<title>Accaza Books</title>
<style>
:root{
  --bd:#241a12; --bm:#3a2a1c; --bl:#b08d57; --gold:#c9a36a;
  --cr:#fbf7f1; --card:#ffffff; --line:#e8ddce; --line2:#f0e8db;
  --tx:#2c2118; --tm:#6b5a49; --tl:#96887a;
  --ok:#2f7d4f; --okbg:#eaf5ee; --warn:#b25b13; --warnbg:#fdf2e6;
  --bad:#b23b34; --badbg:#fbeceb; --info:#2c6e8f; --infobg:#e9f2f6;
  --asset:#2c6e8f; --liab:#b25b13; --equity:#7a5aa8; --income:#2f7d4f; --cogs:#a15a2b; --expense:#b23b34;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cr);color:var(--tx);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
a{color:var(--info)}
.wrap{max-width:1180px;margin:0 auto;padding:0 1rem 4rem}

/* Top bar */
.topbar{background:linear-gradient(135deg,#241a12,#3a2a1c);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.topbar-in{max-width:1180px;margin:0 auto;padding:.7rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem}
.brand .logo{width:34px;height:34px;border-radius:9px;background:radial-gradient(circle at 30% 30%,#e6c88c,#b08d57);display:grid;place-items:center;font-size:1.1rem}
.brand b{font-size:1.05rem;font-weight:800;letter-spacing:.01em}
.brand small{display:block;color:#d9c6ac;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
.topbar .period{margin-left:auto;display:flex;align-items:center;gap:.4rem;color:#e9dcc7;font-size:.78rem}
.topbar select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:7px;padding:.32rem .5rem}
.topbar select option{color:#241a12}
.topbar .tb-actions{display:flex;gap:.4rem}
.tb-actions button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:.34rem .6rem;font-size:.74rem;font-weight:600}
.tb-actions button:hover{background:rgba(255,255,255,.22)}

/* Tabs */
.tabs{display:flex;gap:.15rem;overflow-x:auto;background:#efe6d7;border-bottom:1px solid var(--line);position:sticky;top:53px;z-index:30}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;gap:.15rem;padding:0 .6rem}
.tab{border:none;background:none;padding:.7rem .85rem;font-size:.82rem;font-weight:650;color:var(--tm);border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--bd)}
.tab.active{color:var(--bd);border-bottom-color:var(--bl)}

.page{padding-top:1.2rem}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.page-head h2{font-size:1.35rem}
.page-head p{margin:.15rem 0 0;color:var(--tm);font-size:.85rem}

/* Cards / grid */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-pad{padding:1rem 1.15rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.75rem;margin-bottom:1.1rem}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.85rem .95rem;box-shadow:var(--shadow)}
.kpi .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tl);font-weight:700}
.kpi .val{font-size:1.5rem;font-weight:800;margin-top:.25rem;letter-spacing:-.02em}
.kpi .sub{font-size:.72rem;color:var(--tm);margin-top:.1rem}
.kpi.good .val{color:var(--ok)} .kpi.bad .val{color:var(--bad)}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:820px){.two-col{grid-template-columns:1fr}}

/* Tables */
table{width:100%;border-collapse:collapse}
.tbl-wrap{overflow-x:auto}
th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tl);font-weight:700;padding:.55rem .7rem;border-bottom:1px solid var(--line)}
td{padding:.5rem .7rem;border-bottom:1px solid var(--line2);font-size:.85rem;vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.acc-code{color:var(--tl);font-variant-numeric:tabular-nums;font-size:.78rem}
.linkish{color:var(--info);cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.linkish:hover{text-decoration-style:solid}
tr.total-row td{font-weight:800;border-top:2px solid var(--line);border-bottom:none;background:#faf6ef}
tr.sub-row td{font-weight:700;background:#faf7f1}
.type-pill{display:inline-block;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:.12rem .4rem;border-radius:5px}
.t-asset{color:var(--asset);background:#e9f2f6} .t-liability{color:var(--liab);background:#fdf2e6}
.t-equity{color:var(--equity);background:#f0ebf7} .t-income{color:var(--income);background:#eaf5ee}
.t-cogs{color:var(--cogs);background:#f6ede4} .t-expense{color:var(--expense);background:#fbeceb}

/* Buttons */
.btn{border:1px solid var(--line);background:#fff;color:var(--tx);border-radius:8px;padding:.5rem .8rem;font-size:.82rem;font-weight:650}
.btn:hover{border-color:var(--bl)}
.btn.primary{background:linear-gradient(135deg,#b08d57,#c9a36a);border-color:#a07d47;color:#fff}
.btn.primary:hover{filter:brightness(1.04)}
.btn.ghost{background:none}
.btn.sm{padding:.32rem .55rem;font-size:.74rem}
.btn.danger{color:var(--bad);border-color:#e6bdb9}
.btn-row{display:flex;gap:.5rem;flex-wrap:wrap}

/* Forms */
.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.7rem}
.field label{font-size:.72rem;font-weight:700;color:var(--tm)}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;background:#fff;color:var(--tx)}
.field input:focus,.field select:focus{outline:none;border-color:var(--bl);box-shadow:0 0 0 3px rgba(176,141,87,.14)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.5rem;align-items:end}

/* Journal line editor */
.jl-head,.jl-row{display:grid;grid-template-columns:1fr 130px 130px 34px;gap:.5rem;align-items:center}
.jl-head{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tl);font-weight:700;padding:0 .1rem .3rem}
.jl-row{margin-bottom:.4rem}
.jl-row input,.jl-row select{width:100%}
.jl-x{border:1px solid var(--line);background:#fff;border-radius:7px;height:34px;color:var(--bad);font-weight:800}
.balance-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:.6rem;padding:.6rem .8rem;border-radius:9px;font-weight:700;font-size:.85rem}
.balance-bar.ok{background:var(--okbg);color:var(--ok)}
.balance-bar.off{background:var(--badbg);color:var(--bad)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(30,20,10,.5);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:3vh 1rem;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .12s ease}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.15rem;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:1.05rem}
.modal-body{padding:1.15rem}
.modal-foot{padding:.9rem 1.15rem;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:.5rem}
.x{border:none;background:none;font-size:1.3rem;color:var(--tl);line-height:1}

.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.74rem;font-weight:600;color:var(--tm);background:#f3ece0;border:1px solid var(--line);border-radius:999px;padding:.28rem .6rem;cursor:pointer}
.chip:hover{border-color:var(--bl);color:var(--bd)}
.muted{color:var(--tm)} .tiny{font-size:.74rem} .center{text-align:center}
.empty{text-align:center;color:var(--tl);padding:2.5rem 1rem}
.empty .big{font-size:2rem}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.reversed{opacity:.5;text-decoration:line-through}
.badge-rev{font-size:.6rem;font-weight:800;color:var(--warn);background:var(--warnbg);border-radius:5px;padding:.08rem .35rem;text-transform:uppercase;letter-spacing:.04em}
.hint{background:var(--infobg);border:1px solid #cfe1e9;border-radius:9px;padding:.7rem .85rem;font-size:.8rem;color:#28576b;margin-bottom:1rem}
.section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tl);font-weight:800;margin:.2rem 0 .5rem}
.foot-note{color:var(--tl);font-size:.72rem;margin-top:1.5rem;text-align:center}
.live-pill{font-size:.72rem;font-weight:700;border-radius:999px;padding:.28rem .6rem;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.live-pill.ok{background:rgba(45,158,95,.16);color:#a5d6b6;border-color:rgba(45,158,95,.35)}
.live-pill.off{background:rgba(255,255,255,.1);color:#e9dcc7;border-color:rgba(255,255,255,.2)}
.live-pill.bad{background:rgba(178,59,52,.2);color:#f2b8b3;border-color:rgba(178,59,52,.4)}
.live-pill.warn{background:rgba(201,163,106,.22);color:#f0dcb8;border-color:rgba(201,163,106,.4)}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo">☕</div>
      <div><b>Accaza Books</b><small>Coffee-shop accounting · build v3</small></div>
    </div>
    <span id="liveStatus" class="live-pill off" title="Live POS auto-capture status — click to sign in" onclick="App.signInPrompt()">● Connecting…</span>
    <span id="reviewBadge" class="live-pill warn" style="display:none" title="Unmapped POS accounts to review" onclick="App.go('journal')"></span>
    <div class="period">
      <span>Period</span>
      <select id="periodSel" onchange="App.setPeriod(this.value)"></select>
    </div>
    <div class="tb-actions">
      <a href="admin.html" title="Switch to the POS / Admin panel" style="display:inline-flex;align-items:center;background:rgba(201,163,106,.22);color:#fff;border:1px solid rgba(201,163,106,.5);border-radius:7px;padding:.34rem .6rem;font-size:.74rem;font-weight:700;text-decoration:none">⇄ POS / Admin</a>
      <button onclick="App.exportJSON()" title="Download a backup of all books">⬇ Backup</button>
      <button onclick="document.getElementById('importFile').click()" title="Restore from a backup file">⬆ Restore</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="App.importJSON(this.files[0])"/>
    </div>
  </div>
</div>

<div class="tabs"><div class="tabs-in" id="tabs"></div></div>

<div class="wrap"><div id="page" class="page"></div>
  <div class="foot-note">Accaza Books · build v3 · double-entry, append-only ledger · live Finance data with browser backup support</div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
"use strict";
/* ============================================================
   Accaza Books — standalone double-entry accounting (P1)
   Data model:
     account = {code, name, type, note}
       type ∈ Asset, Liability, Equity, Income, COGS, Expense
       normal balance: Asset/COGS/Expense = debit; Liability/Equity/Income = credit
       (contra accounts handled by sign of their balance, no special flag needed in P1)
     entry = {id, date:'YYYY-MM-DD', ref, memo, lines:[{code, debit, credit}],
              createdAt, reversed:false, reversalOf:null}
   All amounts stored in centavos-free floats but rounded to 2dp on posting.
   ============================================================ */

const TYPES = ["Asset","Liability","Equity","Income","COGS","Expense"];
const DEBIT_NORMAL = {Asset:true, COGS:true, Expense:true, Liability:false, Equity:false, Income:false};
const TYPE_ORDER = {Asset:1, Liability:2, Equity:3, Income:4, COGS:5, Expense:6};

const STORE_KEY = "accaza_books_v1";

/* ---------- default coffee-shop chart of accounts ---------- */
function defaultAccounts(){
  return [
    // Assets
    ["1000","Cash on Hand","Asset"],["1010","Other Bank Accounts","Asset"],["1011","Union Bank","Asset"],["1012","BDO","Asset"],
    ["1013","Security Bank – 4538","Asset"],["1014","Security Bank – 4389","Asset"],["1020","GCash / Maya Wallet","Asset"],
    ["1100","Accounts Receivable – Platforms","Asset","Grab/Panda settlements owed to us"],
    ["1200","Inventory – Coffee & Beans","Asset"],["1210","Inventory – Milk & Dairy","Asset"],
    ["1220","Inventory – Syrups & Flavors","Asset"],["1230","Inventory – Cups & Packaging","Asset"],
    ["1240","Inventory – Food & Pastries","Asset"],["1270","Inventory – Operating & Cleaning Supplies","Asset"],["1280","Inventory – Office Supplies","Asset"],["1290","Inventory Receiving Clearing","Asset","Received inventory awaiting complete posting"],
    ["1500","Equipment","Asset","Espresso machine, grinders"],["1510","Furniture & Fixtures","Asset"],
    ["1590","Accumulated Depreciation","Asset","Contra-asset (credit balance)"],
    // Liabilities
    ["2000","Accounts Payable – Suppliers","Liability"],["2020","Due to Platforms","Liability","Negative Grab/FoodPanda settlements owed to the platform"],["2090","Unrecorded Payables Clearing","Liability","Supplier obligations awaiting complete posting"],["2100","Accrued Salaries","Liability"],
    ["2200","Taxes Payable","Liability"],["2300","Loans Payable","Liability"],
    // Equity
    ["3000","Owner's Capital","Equity"],["3100","Owner's Drawings","Equity","Contra-equity (debit balance)"],
    ["3900","Retained Earnings","Equity"],
    // Income
    ["4000","Sales – In-store","Income"],["4010","Sales – Online (own)","Income"],
    ["4020","Sales – GrabFood","Income"],["4030","Sales – FoodPanda","Income"],
    ["4900","Discounts & Comps","Income","Contra-income (debit balance)"],
    // COGS
    ["5000","COGS – Coffee & Beans","COGS"],["5010","COGS – Milk & Dairy","COGS"],
    ["5020","COGS – Syrups & Flavors","COGS"],["5030","COGS – Food & Pastries","COGS"],
    ["5040","COGS – Cups & Packaging","COGS"],["5090","Unposted COGS Clearing","COGS","Costs awaiting complete item-level posting"],["5900","Wastage & Spoilage","COGS"],
    // Expenses
    ["6000","Salaries & Wages","Expense"],["6010","Rent","Expense"],["6020","Utilities","Expense","Electricity, water"],
    ["6030","Internet & Phone","Expense"],["6040","Platform Commissions","Expense","Grab/Panda fees"],
    ["6050","Marketing & Promotions","Expense"],["6060","Repairs & Maintenance","Expense"],
    ["6070","Cleaning & Operating Supplies","Expense"],["6075","Office & Administrative Supplies","Expense"],["6080","Bank & Payment Fees","Expense"],
    ["6090","Depreciation","Expense"],["6100","Miscellaneous","Expense"]
  ].map(a=>({code:a[0],name:a[1],type:a[2],note:a[3]||""}));
}

/* ---------- remove the original browser-only demo journal ---------- */
const SAMPLE_ENTRY_IDS = new Set(["E1","E2","E3","E4","E5","E6","E7","E8","E9","E10"]);
function stripSampleEntries(p){
  const removed=(p.entries||[]).filter(e=>SAMPLE_ENTRY_IDS.has(e.id)||SAMPLE_ENTRY_IDS.has(e.reversalOf));
  if(!removed.length)return p;
  try{if(!localStorage.getItem(STORE_KEY+"_sample_backup"))localStorage.setItem(STORE_KEY+"_sample_backup",JSON.stringify({removedAt:Date.now(),entries:removed}));}catch(_e){}
  p.entries=(p.entries||[]).filter(e=>!SAMPLE_ENTRY_IDS.has(e.id)&&!SAMPLE_ENTRY_IDS.has(e.reversalOf));
  p.meta=Object.assign({},p.meta||{},{sampleEntriesRemovedAt:Date.now()});
  return p;
}

/* ---------- state ---------- */
let DB = load();
function migrate(p){
  p.accounts=p.accounts||defaultAccounts(); p.entries=p.entries||[]; p.meta=p.meta||{name:"Accaza Coffee House",created:Date.now()};
  // accounts the POS→journal bridge maps into, plus VAT-activation accounts (kept even while Non-VAT)
  var need=[
    ["1030","Undeposited Funds","Asset","Cash awaiting bank deposit"],
    ["1040","Petty Cash","Asset"],
    ["1011","Union Bank","Asset"],["1012","BDO","Asset"],["1013","Security Bank – 4538","Asset"],["1014","Security Bank – 4389","Asset"],
    ["1110","Other Receivables","Asset"],
    ["1250","Input VAT (creditable)","Asset","Used when VAT-registered"],
    ["1260","Creditable Withholding Tax","Asset","CWT withheld by platforms/customers"],
    ["1900","Suspense","Asset","Unmapped POS accounts land here for review"],
    ["1290","Inventory Receiving Clearing","Asset","Received inventory awaiting complete posting"],
    ["1270","Inventory – Operating & Cleaning Supplies","Asset"],["1280","Inventory – Office Supplies","Asset"],
    ["2020","Due to Platforms","Liability","Negative Grab/FoodPanda settlements owed to the platform"],
    ["2090","Unrecorded Payables Clearing","Liability","Supplier obligations awaiting complete posting"],
    ["2210","Output VAT Payable","Liability","Used when VAT-registered"],
    ["2220","Percentage Tax Payable","Liability","Non-VAT percentage tax on gross receipts"],
    ["2230","Withholding Tax Payable","Liability","EWT withheld from payments"],
    ["3050","Cash Float Clearing","Equity","POS shift float source"],
    ["4990","Other Income","Income"],
    ["5090","Unposted COGS Clearing","COGS","Costs awaiting complete item-level posting"],
    ["6045","Platform Discounts","Expense","Grab/Panda-funded or shared discounts"],
    ["6046","Platform Service VAT","Expense"],
    ["6075","Office & Administrative Supplies","Expense"],
    ["6110","Cash Short / Over","Expense","Register variance"]
  ];
  need.forEach(function(n){ if(!p.accounts.find(function(a){return a.code===n[0];})) p.accounts.push({code:n[0],name:n[1],type:n[2],note:n[3]||""}); });
  var supplies=p.accounts.find(function(a){return a.code==='6070';});if(supplies)supplies.name='Cleaning & Operating Supplies';
  p.accounts.sort(function(x,y){return String(x.code).localeCompare(String(y.code));});
  return p;
}
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ const p=JSON.parse(raw); if(p&&p.accounts&&p.entries) return migrate(stripSampleEntries(p)); } }catch(e){}
  return migrate({ accounts: defaultAccounts(), entries: [], meta:{name:"Accaza Coffee House", created:Date.now()} });
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){ alert("Could not save to this browser: "+e.message); } }
save();

/* ---------- helpers ---------- */
const peso = n => "₱"+ (Math.round((Number(n)||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const pesoNoDec = n => "₱"+ Math.round(Number(n)||0).toLocaleString();
const r2 = n => Math.round((Number(n)||0)*100)/100;
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const acc = code => DB.accounts.find(a=>a.code===code);
const accName = code => { const a=acc(code); return a?a.name:("? "+code); };
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* period handling: null = all time, else 'YYYY-MM' */
let PERIOD = null;
/* all entries = local manual entries + live POS-captured entries (window.__posEntries) */
function ENTRIES(){ return DB.entries.concat(window.__posEntries||[]); }
function entriesInPeriod(){ return ENTRIES().filter(e=>!PERIOD || (e.date||"").slice(0,7)===PERIOD); }
function allPeriods(){ const s=new Set(ENTRIES().map(e=>(e.date||"").slice(0,7)).filter(Boolean)); return Array.from(s).sort().reverse(); }
function monthLabel(ym){ if(!ym) return "All time"; const [y,m]=ym.split("-"); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]+" "+y; }

/* signed balance in the account's NORMAL direction (debits positive for debit-normal) */
function accountBalance(code, uptoPeriodOnly){
  let bal=0;
  ENTRIES().forEach(e=>{
    if(e.reversed) return; // reversed entries excluded; their reversal cancels anyway
    if(uptoPeriodOnly && PERIOD && (e.date||"").slice(0,7)!==PERIOD) return;
    e.lines.forEach(l=>{ if(l.code===code){ bal += (Number(l.debit)||0) - (Number(l.credit)||0); } });
  });
  const a=acc(code);
  return DEBIT_NORMAL[a?a.type:"Asset"] ? bal : -bal; // positive = normal side
}
/* raw debit-minus-credit (for balance sheet math) */
function accountNet(code, periodEntries){
  let bal=0; (periodEntries||ENTRIES()).forEach(e=>{ if(e.reversed) return; e.lines.forEach(l=>{ if(l.code===code) bal+=(Number(l.debit)||0)-(Number(l.credit)||0); }); });
  return bal;
}

/* P&L numbers for the current period */
function plData(){
  const ents = entriesInPeriod();
  const sum = type => DB.accounts.filter(a=>a.type===type).map(a=>({a, bal:accountBalance(a.code,true)})).filter(x=>Math.abs(x.bal)>0.005);
  const income = sum("Income"), cogs = sum("COGS"), expense = sum("Expense");
  const totalIncome = income.reduce((s,x)=>s+x.bal,0);
  const totalCogs = cogs.reduce((s,x)=>s+x.bal,0);
  const totalExp = expense.reduce((s,x)=>s+x.bal,0);
  const gross = totalIncome-totalCogs;
  const net = gross-totalExp;
  return {income,cogs,expense,totalIncome,totalCogs,totalExp,gross,net,ents};
}

/* ============================================================ TABS ============================================================ */
const TABS = [
  {id:"dashboard",label:"Dashboard"},
  {id:"transactions",label:"Transactions"},
  {id:"journal",label:"Journal"},
  {id:"ledger",label:"General Ledger"},
  {id:"tb",label:"Trial Balance"},
  {id:"pl",label:"Profit & Loss"},
  {id:"bs",label:"Balance Sheet"},
  {id:"cashflow",label:"Cash Flow"},
  {id:"receivables",label:"Receivables"},
  {id:"payables",label:"Payables"},

  /* ---- journal entry modal ---- */

      TYPES.map(t=>{ const rows=DB.accounts.filter(a=>a.type===t); if(!rows.length) return ""; return `<optgroup label="${t}">`+rows.map(a=>`<option value="${a.code}" ${a.code===sel?'selected':''}>${a.code} · ${esc(a.name)}</option>`).join("")+`</optgroup>`; }).join("");

  _draft:null,
  lineEdit(i,f,v){ this._draft.lines[i][f] = (f==='code')?v:(v===""?"":Number(v)); this.refreshBalBar(); },
  lineAdd(){ this._draft.lines.push({code:"",debit:"",credit:""}); this.rerenderLines(); },
  lineDel(i){ if(this._draft.lines.length<=1) return; this._draft.lines.splice(i,1); this.rerenderLines(); },
  rerenderLines(){ // re-open preserving draft
    const pf=this._draft; this.openEntryModal(pf);
  },
  refreshBalBar(){
    const d=this._draft; let dr=0,cr=0; d.lines.forEach(l=>{dr+=Number(l.debit)||0;cr+=Number(l.credit)||0;});
    dr=r2(dr);cr=r2(cr); const diff=r2(dr-cr); const ok=(diff===0 && dr>0);
    const bar=document.getElementById("balBar"); if(!bar) return;
    bar.className="balance-bar "+(ok?"ok":"off");
    bar.innerHTML = ok ? `<span>✓ Balanced</span><span>Debits ${peso(dr)} · Credits ${peso(cr)}</span>`
      : `<span>${dr===0?'Enter amounts':'Out of balance by '+peso(Math.abs(diff))}</span><span>Debits ${peso(dr)} · Credits ${peso(cr)}</span>`;
    const btn=document.getElementById("postBtn"); if(btn) btn.disabled=!ok, btn.style.opacity=ok?1:.5;

  postEntry(){
    const d=this._draft;
    const lines = d.lines.map(l=>({code:l.code, debit:r2(l.debit||0), credit:r2(l.credit||0)}))
                         .filter(l=>l.code && (l.debit>0||l.credit>0));
    if(lines.length<2) return alert("Need at least two lines.");
    if(lines.some(l=>l.debit>0&&l.credit>0)) return alert("A line can't have both a debit and a credit.");
    const dr=r2(lines.reduce((s,l)=>s+l.debit,0)), cr=r2(lines.reduce((s,l)=>s+l.credit,0));
    if(dr!==cr||dr<=0) return alert("Entry is not balanced.");
    const entry={id:"E"+Date.now(), date:d.date||todayStr(), ref:d.ref||"", memo:d.memo||"", lines, createdAt:Date.now(), reversed:false, reversalOf:null};
    DB.entries.push(entry); save(); this.closeModal();

  rebuildPeriodSel(){

  reverseEntry(id){

    const rev={id:"E"+Date.now(), date:todayStr(), ref:(e.ref||e.id)+"-REV", memo:"Reversal of "+(e.ref||e.id)+" — "+e.memo, createdAt:Date.now(), reversed:false, reversalOf:e.id,
      lines:e.lines.map(l=>({code:l.code, debit:r2(l.credit||0), credit:r2(l.debit||0)}))};
    e.reversed=true; DB.entries.push(rev); save(); this.render();
  },
  closeModal(){ document.getElementById("modalBg").classList.remove("show"); document.getElementById("modal").innerHTML=""; },

  /* ---- drill through: show entries touching an account ---- */
  drill(code){
    const a=acc(code); const ents = entriesInPeriod().filter(e=>e.lines.some(l=>l.code===code));
    let running=0;
    const rows = ents.slice().sort((x,y)=>(x.date+ x.id).localeCompare(y.date+y.id)).map(e=>{
      const l=e.lines.find(l=>l.code===code); const dr=Number(l.debit)||0, crd=Number(l.credit)||0;
      running += DEBIT_NORMAL[a.type]?(dr-crd):(crd-dr);

        <td class="num">${dr?peso(dr):''}</td><td class="num">${crd?peso(crd):''}</td><td class="num">${peso(running)}</td></tr>`;
    }).join("");
    const m=document.getElementById("modal");
    m.innerHTML=`<div class="modal-head"><h3>${a.code} · ${esc(a.name)} <span class="type-pill t-${a.type.toLowerCase()}">${a.type}</span></h3><button class="x" onclick="App.closeModal()">×</button></div>
      <div class="modal-body"><div class="tiny muted" style="margin-bottom:.5rem">${monthLabel(PERIOD)} · ${ents.length} entr${ents.length===1?'y':'ies'} · running balance in ${DEBIT_NORMAL[a.type]?'debit':'credit'} (normal) direction</div>
      <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Entry</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>
      <tbody>${rows||'<tr><td colspan=5 class="empty">No entries in this period</td></tr>'}</tbody></table></div></div>
      <div class="modal-foot"><button class="btn ghost" onclick="App.closeModal()">Close</button></div>`;
    document.getElementById("modalBg").classList.add("show");
  }
};

/* ---------- live Cash Flow (authoritative Finance movements) ---------- */
let CF_FROM=todayStr(), CF_TO=todayStr();
function cfAccounts(){const m=window.__cfAccounts||{};return Object.keys(m).map(id=>Object.assign({id},m[id]||{})).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name||'').localeCompare(String(b.name||'')));}
function cfMovements(){const m=window.__financialMovements||{};return Object.keys(m).map(id=>Object.assign({id},m[id]||{})).sort((a,b)=>Number(a.occurredAt||0)-Number(b.occurredAt||0));}
function cfDay(ts){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(Number(ts)||Date.now())),v={};parts.forEach(p=>v[p.type]=p.value);return v.year+'-'+v.month+'-'+v.day;}
function cfDeltas(m){const out={};(m.lines||[]).forEach(l=>{const a=String(l.account||''),v=(Number(l.debit)||0)-(Number(l.credit)||0);let k='';if(a.indexOf('asset:cash_account:')===0)k=a.slice(19);else if(a==='asset:register_cash')k='register';else if(a==='asset:cash_awaiting_deposit')k='undeposited';else if(a==='asset:petty_cash')k='petty';if(k)out[k]=r2((out[k]||0)+v);});return out;}
function cfCategory(m,net){const x={order_sale:'Sales',order_refund:'Refunds',order_void:'Voided sales',platform_payout_deposit:'Platform payouts received',receivable_collected:'Receivable collections',payable_paid:'Supplier / bill payments',shift_payin:'Register cash-ins',shift_payout:'Register pay-outs',shift_cash_variance:net>0?'Cash overage':'Owner cash withdrawal',petty_cash_expense:'Petty cash expenses',petty_cash_void:'Petty cash reversals',petty_cash_replenishment:'Petty cash top-up',register_cash_deposit:'Register deposits',opening_balance:'Opening balance'};return x[m.type]||(net>0?'Other cash in':'Other cash out');}
function cfStatement(){
  const accs=cfAccounts(),moves=cfMovements(),begin={},ending={},add={},ded={},detail=[];
  const openingSources=new Set(moves.filter(m=>String(m.type||'').indexOf('opening_balance')===0&&m.sourceType==='cashAccount').map(m=>String(m.sourceId||'')));
  function bump(target,k,v){target[k]=r2((target[k]||0)+v);}
  accs.forEach(a=>{if(openingSources.has(a.id))return;const d=a.openingDate||CF_FROM,v=Number(a.opening)||0;if(d<CF_FROM)bump(begin,a.id,v);if(d<=CF_TO)bump(ending,a.id,v);if(d>=CF_FROM&&d<=CF_TO&&Math.abs(v)>=.005){bump(v>0?add:ded,'Opening balance',Math.abs(v));}});
  moves.forEach(m=>{const d=cfDay(m.occurredAt),ds=cfDeltas(m),net=r2(Object.values(ds).reduce((s,v)=>s+v,0));if(d<CF_FROM)Object.keys(ds).forEach(k=>bump(begin,k,ds[k]));if(d<=CF_TO)Object.keys(ds).forEach(k=>bump(ending,k,ds[k]));if(d>=CF_FROM&&d<=CF_TO&&Math.abs(net)>=.005){const cat=cfCategory(m,net);bump(net>0?add:ded,cat,Math.abs(net));detail.push({date:d,id:m.id,type:cat,net});}});
  const keys=accs.map(a=>a.id).concat(['register','undeposited','petty']),sum=o=>r2(Object.values(o).reduce((s,v)=>s+(Number(v)||0),0));return {accs,keys,begin,ending,add,ded,detail,totBegin:sum(begin),totEnd:sum(ending),totAdd:sum(add),totDed:sum(ded)};
}
function cfName(k){const a=cfAccounts().find(x=>x.id===k);return a?a.name:k==='register'?'Register cash':k==='undeposited'?'Undeposited funds':'Petty cash';}
App.cfRange=function(which,v){if(which==='from')CF_FROM=v||todayStr();else CF_TO=v||todayStr();App.render();};
App.cashAccountEdit=function(id){const a=(window.__cfAccounts||{})[id]||{},isNew=!id,m=document.getElementById('modal');m.innerHTML=`<div class="modal-head"><h3>${isNew?'Add':'Edit'} cash account</h3><button class="x" onclick="App.closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Account name</label><input id="cfa_name" value="${esc(a.name||'')}"/></div><div class="grid2"><div class="field"><label>Type</label><select id="cfa_type"><option value="bank" ${a.type==='bank'?'selected':''}>Bank</option><option value="ewallet" ${a.type==='ewallet'?'selected':''}>E-wallet</option></select></div><div class="field"><label>Opening balance date</label><input id="cfa_date" type="date" value="${a.openingDate||'2026-08-23'}"/></div></div><div class="field"><label>Opening balance</label><input id="cfa_open" type="number" step=".01" value="${Number(a.opening)||0}"/></div><div class="field"><label>Payment methods routed here (comma-separated)</label><input id="cfa_feed" value="${esc((a.feedMethods||[]).join(', '))}" placeholder="GCash, Bank Transfer"/></div><div class="hint">Changing an opening balance posts a dated adjustment; it never rewrites or deletes later cash activity.</div></div><div class="modal-foot"><button class="btn ghost" onclick="App.closeModal()">Cancel</button><button class="btn primary" onclick="App.cashAccountSave('${id||''}',this)">Save</button></div>`;document.getElementById('modalBg').classList.add('show');};
App.cashAccountSave=function(id,btn){if(!window.__cashAccountSave)return alert('Live Finance service is not ready.');const name=document.getElementById('cfa_name').value.trim();if(!name)return alert('Enter an account name.');btn.disabled=true;window.__cashAccountSave({action:'upsert',commandId:'cashacct_'+Date.now(),accountId:id||('acc_'+Date.now().toString(36)),name,type:document.getElementById('cfa_type').value,opening:Number(document.getElementById('cfa_open').value)||0,openingDate:document.getElementById('cfa_date').value||todayStr(),feedMethods:document.getElementById('cfa_feed').value.split(',').map(x=>x.trim()).filter(Boolean)}).then(()=>App.closeModal()).catch(e=>{alert('Could not save account: '+((e&&e.message)||e));btn.disabled=false;});};
App.cfRecordDeposit=function(kind,id){const accs=cfAccounts();if(!accs.length)return alert('Add a cash account first.');const source=kind==='payout'?(window.__platformPayouts||{})[id]:(window.__cashCustody||{})[id];if(!source)return;const amount=kind==='payout'?Number(source.actualPayout)||0:Number(source.remaining)||0,m=document.getElementById('modal');m.innerHTML=`<div class="modal-head"><h3>Record deposit</h3><button class="x" onclick="App.closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Deposit to</label><select id="cfd_acct">${accs.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Date</label><input id="cfd_date" type="date" value="${todayStr()}"/></div><div class="field"><label>Amount</label><input value="${amount}" disabled/></div></div></div><div class="modal-foot"><button class="btn ghost" onclick="App.closeModal()">Cancel</button><button class="btn primary" onclick="App.cfSaveDeposit('${kind}','${id}',this)">Record deposit</button></div>`;document.getElementById('modalBg').classList.add('show');};
App.cfSaveDeposit=function(kind,id,btn){btn.disabled=true;const payload=kind==='payout'?{action:'payout_deposit',commandId:'payoutdep_'+Date.now(),payoutId:id,date:document.getElementById('cfd_date').value,accountId:document.getElementById('cfd_acct').value}:{action:'cash_deposit',commandId:'cashdep_'+Date.now(),allocations:{[id]:Number(((window.__cashCustody||{})[id]||{}).remaining)||0},date:document.getElementById('cfd_date').value,accountId:document.getElementById('cfd_acct').value};window.__financeCmd(payload).then(()=>App.closeModal()).catch(e=>{alert('Could not record deposit: '+((e&&e.message)||e));btn.disabled=false;});};

    return `<div class="page-head"><div><h2>Cash Flow</h2><p>Authoritative cash statement · moved from Admin</p></div><div class="btn-row"><button class="btn" onclick="App.go('transactions')">Record transaction</button><button class="btn primary" onclick="App.cashAccountEdit('')">+ Cash account</button></div></div>
      <div class="hint">Beginning cash comes from movements before the selected start date. Opening balances are used only when no opening movement exists, preventing double-counting.</div>
      <div class="kpis">${cards}</div>
      <div class="card card-pad" style="margin-bottom:1rem"><div class="page-head" style="margin-bottom:.6rem"><div><div class="section-label">Cash flow statement</div></div><div class="tiny">From <input type="date" value="${CF_FROM}" onchange="App.cfRange('from',this.value)"/> to <input type="date" value="${CF_TO}" onchange="App.cfRange('to',this.value)"/></div></div>
        <div class="two-col"><div><div class="section-label">Beginning cash · ${CF_FROM}</div><table><tbody>${balRows(s.begin)}<tr class="total-row"><td>Total beginning cash</td><td class="num">${peso(s.totBegin)}</td></tr></tbody></table></div><div><div class="section-label">Ending cash · ${CF_TO}</div><table><tbody>${balRows(s.ending)}<tr class="total-row"><td>Total ending cash</td><td class="num">${peso(s.totEnd)}</td></tr></tbody></table></div></div>
        <div class="two-col" style="margin-top:1rem"><div><div class="section-label" style="color:var(--ok)">Additions — money in</div><table><tbody>${moneyRows(s.add,'var(--ok)')}<tr class="total-row"><td>Total additions</td><td class="num">${peso(s.totAdd)}</td></tr></tbody></table></div><div><div class="section-label" style="color:var(--bad)">Deductions — money out</div><table><tbody>${moneyRows(s.ded,'var(--bad)')}<tr class="total-row"><td>Total deductions</td><td class="num">${peso(s.totDed)}</td></tr></tbody></table></div></div>
        <div class="balance-bar ${ties?'ok':'off'}">${ties?'✓ Cash statement ties':'✗ Cash statement differs by '+peso(Math.abs(expected-s.totEnd))}<span>${peso(s.totBegin)} + ${peso(s.totAdd)} − ${peso(s.totDed)} = ${peso(expected)}</span></div></div>

      <div class="card" style="margin-bottom:1rem"><div class="card-pad"><div class="section-label">Deposits to record</div><div class="tiny muted">Positive platform payouts and register cash awaiting a bank or wallet deposit.</div></div><div class="tbl-wrap"><table><thead><tr><th>Source</th><th>Date</th><th class="num">Amount</th><th></th></tr></thead><tbody>${depositRows||'<tr><td colspan="4" class="empty">No deposits waiting to be recorded.</td></tr>'}</tbody></table></div></div>
      <div class="card"><div class="card-pad"><div class="section-label">Cash activity · selected period</div></div><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Movement</th><th class="num">Net cash</th></tr></thead><tbody>${activity||'<tr><td colspan="3" class="empty">No cash activity in this period.</td></tr>'}</tbody></table></div></div>`;

  journal(){
    const ents = entriesInPeriod().slice().sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
    const rows = ents.map(e=>{
      const dr=e.lines.reduce((s,l)=>s+(Number(l.debit)||0),0);
      const linesHtml = e.lines.map(l=>`<div style="display:flex;justify-content:space-between;gap:1rem">
          <span style="${(Number(l.credit)||0)>0?'padding-left:1.1rem':''}"><span class="acc-code">${l.code}</span> ${esc(accName(l.code))}</span>
          <span class="num">${(Number(l.debit)||0)>0?peso(l.debit):'<span class="muted">'+peso(l.credit)+' cr</span>'}</span></div>`).join("");
      return `<tr class="${e.reversed?'reversed':''}">
        <td style="white-space:nowrap">${e.date}<div class="tiny muted">${esc(e.ref)||'—'} ${e.source==='pos'?'<span class="badge-rev" style="color:#28576b;background:#e9f2f6">POS</span>':''}${e.reversalOf?'<span class=badge-rev>reversal</span>':''}${e.reversed?'<span class=badge-rev>reversed</span>':''}</div></td>

        <td style="white-space:nowrap">${e.source==='pos'?'<span class="tiny muted">auto</span>':(e.reversed||e.reversalOf?'':`<button class="btn sm ghost" onclick="App.reverseEntry('${e.id}')" title="Post a reversing entry">Reverse</button>`)}</td></tr>`;
    }).join("");
    return `<div class="page-head"><div><h2>Journal</h2><p>${monthLabel(PERIOD)} · ${ents.length} entr${ents.length===1?'y':'ies'} · append-only</p></div>
        <button class="btn primary" onclick="App.newEntry()">+ New entry</button></div>
      <div class="card"><div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Entry &amp; lines</th><th class="num">Amount</th><th></th></tr></thead>
        <tbody>${rows||'<tr><td colspan=4><div class="empty"><div class="big">📓</div>No entries in this period.<br><button class="btn primary" style="margin-top:.8rem" onclick="App.newEntry()">Post your first entry</button></div></td></tr>'}</tbody>
      </table></div></div>`;
  },

  ledger(){
    const groups = TYPES.map(t=>({t, rows:DB.accounts.filter(a=>a.type===t)}));
    const body = groups.map(g=>{
      const rws = g.rows.map(a=>{ const bal=accountBalance(a.code,true); const has=Math.abs(bal)>0.005;
        return `<tr><td><span class="acc-code">${a.code}</span></td>
          <td><span class="linkish" onclick="App.drill('${a.code}')">${esc(a.name)}</span></td>
          <td class="num">${has?peso(bal):'<span class="muted">'+peso(0)+'</span>'}</td></tr>`; }).join("");
      return `<tr class="sub-row"><td colspan="3"><span class="type-pill t-${g.t.toLowerCase()}">${g.t}</span></td></tr>`+rws;
    }).join("");

  },

  tb(){
    let totDr=0, totCr=0;
    const rows = DB.accounts.map(a=>{
      const net = accountNet(a.code, entriesInPeriod()); // debit-positive
      const dr = net>0?net:0, cr=net<0?-net:0; totDr+=dr; totCr+=cr;
      return `<tr><td><span class="acc-code">${a.code}</span></td>
        <td><span class="linkish" onclick="App.drill('${a.code}')">${esc(a.name)}</span> <span class="type-pill t-${a.type.toLowerCase()}">${a.type}</span></td>
        <td class="num">${dr?peso(dr):'<span class="muted">—</span>'}</td><td class="num">${cr?peso(cr):'<span class="muted">—</span>'}</td></tr>`;
    }).join("");
    const balanced = Math.abs(r2(totDr)-r2(totCr))<0.005;
    return `<div class="page-head"><div><h2>Trial Balance</h2><p>${monthLabel(PERIOD)} · proves the books are in balance</p></div></div>
      <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Account</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead>
      <tbody>${rows}<tr class="total-row"><td></td><td>Totals</td><td class="num">${peso(totDr)}</td><td class="num">${peso(totCr)}</td></tr></tbody></table></div>
      <div class="card-pad ${balanced?'':''}" style="border-top:1px solid var(--line)"><span class="balance-bar ${balanced?'ok':'off'}" style="display:inline-flex">${balanced?'✓ In balance — debits equal credits':'✗ Out of balance by '+peso(Math.abs(totDr-totCr))}</span></div></div>`;
  },

  pl(){
    const pl=plData();
    const line=(x,contra)=>`<tr><td><span class="acc-code">${x.a.code}</span> <span class="linkish" onclick="App.drill('${x.a.code}')">${esc(x.a.name)}</span></td><td class="num ${contra?'neg':''}">${contra?'('+peso(x.bal)+')':peso(x.bal)}</td></tr>`;
    // contra: Income accounts with debit-normal balance (4900) show as negative already via bal sign
    const incomeRows = pl.income.map(x=> line(x, x.bal<0)).join("");
    const cogsRows = pl.cogs.map(x=>line(x,true)).join("");
    const expRows = pl.expense.map(x=>line(x,true)).join("");
    const grossPct = pl.totalIncome>0?(pl.gross/pl.totalIncome*100):0;
    const netPct = pl.totalIncome>0?(pl.net/pl.totalIncome*100):0;
    return `<div class="page-head"><div><h2>Profit &amp; Loss</h2><p>${monthLabel(PERIOD)}</p></div>
      <button class="btn primary" onclick="App.newEntry()">+ New entry</button></div>
      <div class="card"><div class="tbl-wrap"><table>
        <thead><tr><th>Account</th><th class="num">Amount</th></tr></thead>
        <tbody>
          <tr class="sub-row"><td colspan="2">Revenue</td></tr>
          ${incomeRows||'<tr><td colspan=2 class="muted">No sales in this period</td></tr>'}
          <tr class="total-row"><td>Total revenue</td><td class="num">${peso(pl.totalIncome)}</td></tr>
          <tr class="sub-row"><td colspan="2">Cost of goods sold</td></tr>
          ${cogsRows||'<tr><td colspan=2 class="muted">—</td></tr>'}
          <tr class="total-row"><td>Total COGS</td><td class="num neg">(${peso(pl.totalCogs)})</td></tr>
          <tr class="total-row"><td>Gross profit <span class="tiny muted">${grossPct.toFixed(1)}%</span></td><td class="num ${pl.gross>=0?'pos':'neg'}">${peso(pl.gross)}</td></tr>
          <tr class="sub-row"><td colspan="2">Operating expenses</td></tr>
          ${expRows||'<tr><td colspan=2 class="muted">—</td></tr>'}
          <tr class="total-row"><td>Total expenses</td><td class="num neg">(${peso(pl.totalExp)})</td></tr>
          <tr class="total-row"><td>Net ${pl.net>=0?'income':'loss'} <span class="tiny muted">${netPct.toFixed(1)}%</span></td><td class="num ${pl.net>=0?'pos':'neg'}" style="font-size:1.05rem">${peso(pl.net)}</td></tr>
        </tbody></table></div></div>`;
  },

  bs(){
    // Balance sheet uses ALL entries up to and including selected period (cumulative), not just the month.
    // For P1: if a period is selected we still show cumulative-to-date is complex; show all-time snapshot with a note.
    const ents = ENTRIES(); // cumulative all-time (local + live POS)
    const grp = type => DB.accounts.filter(a=>a.type===type).map(a=>{ const net=accountNet(a.code,ents); const bal = DEBIT_NORMAL[type]?net:-net; return {a,bal}; }).filter(x=>Math.abs(x.bal)>0.005);
    const assets=grp("Asset"), liab=grp("Liability"), equity=grp("Equity");
    const totAssets=assets.reduce((s,x)=>s+x.bal,0);
    const totLiab=liab.reduce((s,x)=>s+x.bal,0);
    let totEquity=equity.reduce((s,x)=>s+x.bal,0);
    // net income all-time (Income - COGS - Expense) folds into equity
    const inc = DB.accounts.filter(a=>a.type==="Income").reduce((s,a)=>s+ -accountNet(a.code,ents),0);
    const cog = DB.accounts.filter(a=>a.type==="COGS").reduce((s,a)=>s+ accountNet(a.code,ents),0);
    const exp = DB.accounts.filter(a=>a.type==="Expense").reduce((s,a)=>s+ accountNet(a.code,ents),0);
    const netIncome = inc - cog - exp;
    const totEquityWithNI = totEquity + netIncome;
    const totLE = totLiab + totEquityWithNI;
    const balanced = Math.abs(r2(totAssets)-r2(totLE))<0.005;
    const rows = arr => arr.map(x=>`<tr><td><span class="acc-code">${x.a.code}</span> <span class="linkish" onclick="App.drill('${x.a.code}')">${esc(x.a.name)}</span></td><td class="num">${peso(x.bal)}</td></tr>`).join("");
    return `<div class="page-head"><div><h2>Balance Sheet</h2><p>All-time snapshot as of latest entry</p></div></div>
      <div class="hint">P1 shows a cumulative all-time balance sheet (period filter applies to P&amp;L, Ledger and Trial Balance). Proper period-end snapshots with retained-earnings roll-forward come with the close process in a later phase.</div>
      <div class="two-col">
        <div class="card"><div class="card-pad"><div class="section-label"><span class="type-pill t-asset">Assets</span></div></div><div class="tbl-wrap"><table><tbody>
          ${rows(assets)||'<tr><td class="muted">—</td><td></td></tr>'}
          <tr class="total-row"><td>Total assets</td><td class="num">${peso(totAssets)}</td></tr></tbody></table></div></div>
        <div class="card"><div class="card-pad"><div class="section-label"><span class="type-pill t-liability">Liabilities</span> &amp; <span class="type-pill t-equity">Equity</span></div></div><div class="tbl-wrap"><table><tbody>
          <tr class="sub-row"><td colspan="2">Liabilities</td></tr>
          ${rows(liab)||'<tr><td class="muted">—</td><td></td></tr>'}
          <tr><td><b>Total liabilities</b></td><td class="num"><b>${peso(totLiab)}</b></td></tr>
          <tr class="sub-row"><td colspan="2">Equity</td></tr>
          ${rows(equity)||''}
          <tr><td>Net income (all-time)</td><td class="num ${netIncome>=0?'pos':'neg'}">${peso(netIncome)}</td></tr>
          <tr><td><b>Total equity</b></td><td class="num"><b>${peso(totEquityWithNI)}</b></td></tr>
          <tr class="total-row"><td>Total liabilities &amp; equity</td><td class="num">${peso(totLE)}</td></tr></tbody></table></div></div>
      </div>
      <div class="card-pad center"><span class="balance-bar ${balanced?'ok':'off'}" style="display:inline-flex">${balanced?'✓ Balanced — Assets = Liabilities + Equity':'✗ Out of balance by '+peso(Math.abs(totAssets-totLE))}</span></div>`;
  },

  coa(){
    const groups = TYPES.map(t=>({t, rows:DB.accounts.filter(a=>a.type===t)}));
    const body = groups.map(g=>`<tr class="sub-row"><td colspan="4"><span class="type-pill t-${g.t.toLowerCase()}">${g.t}</span> <span class="tiny muted">· normal balance: ${DEBIT_NORMAL[g.t]?'Debit':'Credit'}</span></td></tr>`+
      g.rows.map(a=>`<tr><td><span class="acc-code">${a.code}</span></td><td><b>${esc(a.name)}</b></td><td class="tiny muted">${esc(a.note)}</td>
        <td style="white-space:nowrap"><button class="btn sm ghost" onclick="App.editAccount('${a.code}')">Edit</button></td></tr>`).join("")
    ).join("");
    return `<div class="page-head"><div><h2>Chart of Accounts</h2><p>${DB.accounts.length} accounts · tailored for a coffee shop · fully editable</p></div>
      <button class="btn primary" onclick="App.editAccount()">+ Add account</button></div>
      <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Account</th><th>Note</th><th></th></tr></thead><tbody>${body}</tbody></table></div></div>`;
  }
};

/* ---- AR / AP subledgers + aging (read live from /receivables, /payables) ---- */
var AGING_ORDER = ['Current','1–30','31–60','61–90','90+','No due date'];
function agingBucket(due){
  if(!due) return 'No due date';
  var t = Date.parse(String(due)+'T00:00:00'); if(isNaN(t)) return 'No due date';
  var days = Math.floor((Date.now()-t)/86400000);
  if(days<=0) return 'Current'; if(days<=30) return '1–30'; if(days<=60) return '31–60'; if(days<=90) return '61–90'; return '90+';
}
function openDocs(map){ return Object.keys(map||{}).map(function(k){return Object.assign({id:k}, map[k]||{});}).filter(function(d){return (d.status||'open')==='open' && (Number(d.amount)||0)>0;}); }
function arApTotals(){
  var ar=openDocs(window.__arMap).reduce(function(s,d){return s+(Number(d.amount)||0);},0);
  var ap=openDocs(window.__apMap).reduce(function(s,d){return s+(Number(d.amount)||0);},0);
  return {ar:ar, ap:ap, net:ar-ap};
}
function subledgerPage(kind){
  var isAr = kind==='ar', map = isAr?window.__arMap:window.__apMap, live = !!window.__booksUser;
  var title = isAr?'Receivables':'Payables', sub = isAr?'Money owed to you':'Money you owe';
  if(!live) return '<div class="page-head"><div><h2>'+title+'</h2><p>'+sub+'</p></div></div>'+
    '<div class="empty"><div class="big">'+(isAr?'📥':'📤')+'</div><b>Sign in for live '+title.toLowerCase()+'</b><br><span class="tiny">This subledger reads your live finance data. Click the status pill (top-right) to sign in with your Accaza admin account, or open this app from your Accaza domain.</span></div>';
  var docs = openDocs(map).sort(function(a,b){return String(a.due||'9999-99-99').localeCompare(String(b.due||'9999-99-99'));});
  if(!docs.length) return '<div class="page-head"><div><h2>'+title+'</h2><p>'+sub+'</p></div></div><div class="empty"><div class="big">✓</div>No open '+title.toLowerCase()+'.</div>';
  var buckets={}; AGING_ORDER.forEach(function(b){buckets[b]=0;});
  var total=0; docs.forEach(function(d){var amt=Number(d.amount)||0; total+=amt; buckets[agingBucket(d.due)]+=amt;});
  var agingCards = AGING_ORDER.filter(function(b){return buckets[b]>0.005;}).map(function(b){
    return '<div class="kpi"><div class="lbl">'+b+'</div><div class="val" style="font-size:1.15rem">'+pesoNoDec(buckets[b])+'</div></div>';}).join('');
  var rows = docs.map(function(d){
    var bkt = agingBucket(d.due), overdue = (bkt!=='Current' && bkt!=='No due date');
    return '<tr><td><b>'+esc(d.party||'—')+'</b>'+(d.ref?'<div class="tiny muted">'+esc(d.ref)+'</div>':'')+'</td><td class="tiny">'+esc(d.type||'')+'</td><td class="tiny">'+esc(d.date||'')+'</td><td class="tiny">'+esc(d.due||'—')+'</td><td><span class="type-pill '+(overdue?'t-expense':'t-income')+'">'+bkt+'</span></td><td class="num">'+peso(d.amount)+'</td></tr>';}).join('');
  var t = arApTotals();
  return '<div class="page-head"><div><h2>'+title+'</h2><p>'+sub+' · '+docs.length+' open · net working capital '+pesoNoDec(t.net)+'</p></div></div>'+
    '<div class="kpis"><div class="kpi '+(isAr?'good':'bad')+'"><div class="lbl">Total '+(isAr?'receivable':'payable')+'</div><div class="val">'+pesoNoDec(total)+'</div><div class="sub">'+docs.length+' open</div></div>'+agingCards+'</div>'+
    '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Party</th><th>Type</th><th>Date</th><th>Due</th><th>Aging</th><th class="num">Amount</th></tr></thead><tbody>'+rows+
    '<tr class="total-row"><td colspan="5">Total open '+title.toLowerCase()+'</td><td class="num">'+peso(total)+'</td></tr></tbody></table></div></div>'+
    '<p class="tiny muted" style="margin-top:.6rem">Aging as of today. Recording a '+(isAr?'collection':'payment')+' or creating a new one comes with the Transactions tab.</p>';
}
PAGES.receivables = function(){ return subledgerPage('ar'); };
PAGES.payables = function(){ return subledgerPage('ap'); };

/* ---- Transactions: finance-originated postings via postFinancialCommand ---- */
function uid(){ try{return crypto.randomUUID();}catch(_e){return 'id_'+Date.now()+'_'+Math.floor(Math.random()*1e6);} }
function fval(id){ var el=document.getElementById(id); return el?String(el.value).trim():''; }
function cashAccountOptions(sel){ var m=window.__cfAccounts||{}, ks=Object.keys(m); if(!ks.length) return '<option value="">(no cash accounts found)</option>'; return ks.map(function(k){return '<option value="'+esc(k)+'"'+(k===sel?' selected':'')+'>'+esc(m[k].name||k)+'</option>';}).join(''); }
function openDocOptions(map){ var d=openDocs(map); if(!d.length) return ''; return d.map(function(x){return '<option value="'+esc(x.id)+'">'+esc(x.party||'—')+' · '+peso(x.amount)+(x.due?' · due '+esc(x.due):'')+(x.ref?' · '+esc(x.ref):'')+'</option>';}).join(''); }
var TXN_CATS = [['rent','Rent'],['utilities','Utilities'],['salaries','Salaries'],['bank charges','Bank charges'],['repairs','Repairs & maintenance'],['marketing','Marketing'],['supplies','Supplies'],['internet','Internet & phone'],['purchases','Purchases'],['other','Other']];
function catOptions(sel){ return TXN_CATS.map(function(c){return '<option value="'+c[0]+'"'+(c[0]===sel?' selected':'')+'>'+c[1]+'</option>';}).join(''); }

PAGES.transactions = function(){
  if(!window.__booksUser) return '<div class="page-head"><div><h2>Transactions</h2><p>Record finance transactions</p></div></div><div class="empty"><div class="big">🧾</div><b>Sign in to record transactions</b><br><span class="tiny">These post to your shared finance ledger through your server functions. Click the status pill (top-right) to sign in, or open from your Accaza domain.</span></div>';

function faList(){ var m=window.__faMap||{}; return Object.keys(m).map(function(k){return Object.assign({id:k},m[k]||{});}); }
function faMonthly(a){ var life=Math.max(1,Math.round(Number(a.usefulLifeMonths)||0)); return r2(((Number(a.cost)||0)-Math.max(0,Number(a.salvage)||0))/life); }
function faNBV(a){ return r2((Number(a.cost)||0)-(Number(a.accumulatedDepreciation)||0)); }
App._faRun=function(btn, payload, done){ if(!window.__fixedAsset){alert('Live connection not ready — sign in first.');return;} btn.disabled=true; var old=btn.textContent; btn.textContent='Working…'; window.__fixedAsset(payload).then(function(res){ App.closeModal(); if(done)done(res); App.render(); }).catch(function(e){ alert('Could not post: '+((e&&e.message)||e)); btn.disabled=false; btn.textContent=old; }); };
PAGES.fixedassets = function(){

  var assets=faList(), active=assets.filter(function(a){return a.status!=='disposed';});

  var rows=assets.sort(function(a,b){return String(b.acquiredDate||'').localeCompare(String(a.acquiredDate||''));}).map(function(a){

      '<td class="num">'+peso(a.accumulatedDepreciation||0)+'</td>'+
      '<td class="num"><b>'+peso(faNBV(a))+'</b></td>'+
      '<td><span class="type-pill '+(disposed?'t-expense':full?'t-liability':'t-asset')+'">'+(disposed?'Disposed':full?'Fully dep.':'Active')+'</span></td>'+

      <button class="btn ghost" onclick="App.closeModal()">Cancel</button>

App.saveAccount=function(orig){
  const code=document.getElementById("a_code").value.trim(), name=document.getElementById("a_name").value.trim(),
        type=document.getElementById("a_type").value, note=document.getElementById("a_note").value.trim();
  if(!code||!name) return alert("Code and name are required.");
  if(!orig && acc(code)) return alert("That code already exists.");
  if(orig){ const a=acc(orig); a.name=name; a.type=type; a.note=note; }
  else DB.accounts.push({code,name,type,note});
  DB.accounts.sort((x,y)=>x.code.localeCompare(y.code));
  save(); this.closeModal(); this.render();
};
App.deleteAccount=function(code){
  const used = ENTRIES().some(e=>e.lines.some(l=>l.code===code));
  if(used) return alert("This account is used in journal entries and can't be deleted. You can rename it instead.");
  if(!confirm("Delete this account?")) return;
  DB.accounts = DB.accounts.filter(a=>a.code!==code); save(); this.closeModal(); this.render();
};

  if(!window.__booksAuthReady){ alert("Live sync is still starting. If this page is opened directly from a file it can't reach Firebase — deploy it to your Accaza domain (e.g. accazacoffee.com/books.html) so it shares your admin login."); return; }
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="modal-head"><h3>Sign in to live POS sync</h3><button class="x" onclick="App.closeModal()">×</button></div>
    <div class="modal-body"><p class="tiny muted" style="margin-top:0">Use your Accaza admin account. When this app is served from the same domain as the POS, you're signed in automatically.</p>
      <div class="field"><label>Email</label><input id="si_email" type="email" autocomplete="username"/></div>
      <div class="field"><label>Password</label><input id="si_pw" type="password" autocomplete="current-password"/></div></div>
    <div class="modal-foot"><button class="btn ghost" onclick="App.closeModal()">Cancel</button>
      <button class="btn primary" onclick="window.__booksSignIn(document.getElementById('si_email').value,document.getElementById('si_pw').value)">Sign in</button></div>`;
  document.getElementById("modalBg").classList.add("show");
};
App.syncBooks=function(btn){
  if(!window.__booksSync){alert("Live sync is not ready — sign in first.");return;}
  if(!confirm("Sync every historical Finance transaction into Books? This is idempotent and safe to rerun."))return;
  btn.disabled=true;const old=btn.textContent;btn.textContent="Syncing…";
  window.__booksSync().then(function(r){
    alert("Books synced. Finance movements: "+r.movements+" · COGS posted: "+r.cogsPosted+" · COGS awaiting review: "+r.missingCogs+" · opening cash: "+peso(r.openingCash));
    btn.disabled=false;btn.textContent=old;
  }).catch(function(e){alert("Books sync stopped: "+((e&&e.message)||e)+" Safe to retry.");btn.disabled=false;btn.textContent=old;});
};

window.App = App; // expose for the live-POS reader module below
// If the Firebase SDK can't load at all (opened offline / from a file), downgrade the pill.
setTimeout(function(){ var el=document.getElementById('liveStatus'); if(el && /Connecting/.test(el.textContent) && !window.__booksAuthReady){ el.textContent='● Offline (local only)'; el.className='live-pill off'; } },5000);
App.init();
</script>

  let journalCache={}, reviewCache={};

      if(lines.length) out.push({id:"pos_"+k, date:n.date||String(k).slice(0,10), ref:n.ref||k, memo:n.memo||"POS entry", lines, source:"pos", channel:n.channel||"", reversed:false, reversalOf:null}); });
    return out; }
  function refresh(){ window.__posEntries=toEntries(journalCache);

      onValue(ref(db,"/platformPayouts"), s=>{ window.__platformPayouts=s.val()||{}; if(window.App&&App.render)App.render(); }, ()=>{});
      onValue(ref(db,"/cashCustody"), s=>{ window.__cashCustody=s.val()||{}; if(window.App&&App.render)App.render(); }, ()=>{});

  });
}
