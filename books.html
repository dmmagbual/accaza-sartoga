<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'"/>
<meta name="accaza-books-build" content="97"/>
<title>Accaza Books</title>
<link rel="stylesheet" href="assets/css/books.css"/>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo">☕</div>
      <div><b>Accaza Books</b><small>Coffee-shop accounting · build v97</small></div>
    </div>
    <span id="liveStatus" class="live-pill off" title="Live POS auto-capture status — click to sign in" onclick="App.signInPrompt()">● Connecting…</span>
    <div class="period" aria-label="Shared report date range">
      <span>Dates</span>
      <input id="periodFrom" type="date" aria-label="Report start date"/>
      <span>to</span>
      <input id="periodTo" type="date" aria-label="Report end date"/>
      <button type="button" onclick="App.applyDateRange()">Apply</button>
      <button type="button" onclick="window.AccazaReportPeriod.set({mode:'all'})">All time</button>
    </div>
    <div class="tb-actions">
      <a href="admin.html" title="Switch to the POS / Admin panel" style="display:inline-flex;align-items:center;background:rgba(201,163,106,.22);color:#fff;border:1px solid rgba(201,163,106,.5);border-radius:7px;padding:.34rem .6rem;font-size:.74rem;font-weight:700;text-decoration:none">⇄ POS / Admin</a>
    </div>
  </div>
</div>

<nav class="books-navigation" aria-label="Finance Books navigation">
  <div class="book-groups" id="bookGroups" aria-label="Finance work areas"></div>
  <div class="tabs"><div class="tabs-in" id="tabs" aria-label="Finance screens"></div></div>
</nav>

<div class="wrap"><div id="page" class="page"></div>
  <div class="foot-note">Accaza Books · build v97 · double-entry, audited ledger · shared server-authoritative Finance data</div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script src="assets/js/shared/business-date.js"></script>
<script src="assets/js/shared/report-period.js"></script>
<script src="assets/js/shared/sales-authority.js"></script>
<script src="src/books/business-intelligence.js"></script>
<script src="src/books/csv-exports.js"></script>
<script src="assets/js/books/app.js"></script>

<!-- Live POS auto-capture reader: subscribes to /books written by the Cloud Function bridge -->
<script type="module" src="assets/js/books/live-pos.mjs"></script>
<script type="module" src="assets/js/books/accounting-periods.mjs"></script>
</body>
</html>
