name: Deploy Firebase Functions & Rules

# Runs when functions/ OR the database/storage rules change.
# Static site files (admin.html / index.html / assets) still publish via Pages.
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "database.rules.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab too

permissions:
  contents: read

concurrency:
  group: accaza-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root test dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install function dependencies
        working-directory: functions
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run Accaza quality gate
        run: npm run test:ci

      - name: Verify the default Firestore database exists
        run: |
          firebase firestore:databases:list --project accaza-sartoga --json > firestore-databases.json
          node -e "const x=require('./firestore-databases.json');if(!(x.result||[]).some(d=>String(d.name||'').endsWith('/databases/(default)')))throw new Error('Create the default Firestore database in asia-southeast1 before deployment.');"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Firebase requires an explicit acknowledgement when a function enables
      # retry-on-failure. Keep --force scoped to these named functions so the
      # full deployment cannot silently delete unrelated production functions.
      - name: Acknowledge retry policy for durable order functions
        run: firebase deploy --only functions:preservePostedOrderOnDelete,functions:replicateArchivedOrderToFirestore,functions:refreshHistoricalOrderAfterJournal,functions:refreshHistoricalOrderAfterInventoryPlan --project accaza-sartoga --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Functions and rules
        run: firebase deploy --only functions,database,firestore,storage --project accaza-sartoga --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
