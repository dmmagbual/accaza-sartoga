name: Deploy Firebase Functions & Rules

# Runs when functions/ OR the database/storage rules change.
# Static site files (admin.html / index.html / assets) still publish via Pages.
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "database.rules.json"
      - "storage.rules"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab too

permissions:
  contents: read

concurrency:
  group: accaza-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root test dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install function dependencies
        working-directory: functions
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run Accaza quality gate
        run: npm run test:ci

      - name: Deploy Functions and rules
        run: firebase deploy --only functions,database,storage --project accaza-sartoga --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
