name: Deploy Firebase Functions & Rules

# Runs when functions/ OR the database/storage rules change.
# Static site files (admin.html / index.html / assets) still publish via Pages.
on:
  push:
    paths:
      - "functions/**"
      - "database.rules.json"
      - "storage.rules"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab too

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root test dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install function dependencies
        working-directory: functions
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Accaza quality gate
        run: npm run test:ci

      - name: Deploy functions
        run: firebase deploy --only functions --project accaza-sartoga --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy database & storage rules
        run: firebase deploy --only database,storage --project accaza-sartoga --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
