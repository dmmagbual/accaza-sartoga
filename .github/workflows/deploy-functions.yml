name: Deploy Firebase Functions & Rules

# Runs when functions/ OR the database/storage rules change.
# Static site files (admin.html / index.html / assets) still publish via Pages.
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "database.rules.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab too

permissions:
  contents: read

concurrency:
  group: accaza-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Both deploy steps can now retry once after a transient Cloud Functions API error.
    # The previous 25 minutes left no headroom for that, and a timeout kill in the middle
    # of a deploy is worse than a longer wait.
    timeout-minutes: 35
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root test dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install function dependencies
        working-directory: functions
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run Accaza quality gate
        run: npm run test:ci

      - name: Verify the default Firestore database exists
        run: |
          firebase firestore:databases:list --project accaza-sartoga --json > firestore-databases.json
          node -e "const x=require('./firestore-databases.json');if(!(x.result||[]).some(d=>String(d.name||'').endsWith('/databases/(default)')))throw new Error('Create the default Firestore database in asia-southeast1 before deployment.');"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Firebase requires an explicit acknowledgement when a function enables
      # retry-on-failure. Keep --force scoped to these named functions so the
      # full deployment cannot silently delete unrelated production functions.
      - name: Acknowledge retry policy for idempotent retry functions
        run: |
          only="functions:preservePostedOrderOnDelete,functions:replicateArchivedOrderToFirestore,functions:refreshHistoricalOrderAfterJournal,functions:refreshHistoricalOrderAfterInventoryPlan,functions:updateBooksMonthlyNet,functions:updateCashBalanceSummary,functions:updatePublicCatalogVersionOnCategories,functions:updatePublicCatalogVersionOnMenuItems,functions:updatePublicCatalogVersionOnOptionGroups,functions:updatePublicCatalogVersionOnPackages,functions:onShiftCloseAssurance,functions:syncUndepositedLedgerPageIndex,functions:syncPettyVoucherAttentionIndex,functions:onOrderLoyaltyEarning,functions:onOrderDragonQuestProgress,functions:markBackupDirtyArchivedOrders,functions:markBackupDirtyInventoryMovements,functions:markBackupDirtyOrderInventoryPlans,functions:markBackupDirtyFinancialMovements,functions:markBackupDirtyCashBalanceApplied,functions:markBackupDirtyBooksJournal,functions:markBackupDirtyShifts,functions:markBackupDirtyOperationalAudit,functions:markBackupDirtyFinancialCommandClaims,functions:markBackupDirtyInventoryAccounting,functions:markBackupDirtyFinancialApprovals,functions:markBackupDirtyActivityLog,functions:markBackupDirtyCfLedger,functions:markBackupDirtyPettyCashReceipts,functions:markBackupDirtyStockReceipts,functions:markBackupDirtyPurchaseInvoices,functions:markBackupDirtyPlatformPayouts,functions:markBackupDirtyInternalUsage,functions:markBackupDirtyInventoryAdjustments,functions:markBackupDirtyPettyCashVouchers,functions:markBackupDirtyPettyCashReplenishments,functions:markBackupDirtyReceivables,functions:markBackupDirtyPayables,functions:markBackupDirtySuppliers,functions:markBackupDirtyInventorySku,functions:markBackupDirtyAppCustomers,functions:markBackupDirtyReviews,functions:markBackupDirtyFeedbacks,functions:markBackupDirtyPackages,functions:markBackupDirtyLoyaltyLedger,functions:markBackupDirtyLoyaltyRewards,functions:markBackupDirtyDragonQuestLedger,functions:markBackupDirtyDragonQuestOrderIndex,functions:markBackupDirtyArchivedQrTickets"
          # A transient Cloud Functions API error (HTTP 429 mutation quota, or an HTML error
          # page the CLI cannot parse as JSON) leaves one straggler function behind and fails
          # the run even though everything else deployed. Runs 411 and 412 both failed this way
          # with 176 of 177 functions already updated. One retry after the per-minute quota
          # window clears resolves it without anyone having to notice and click Re-run.
          set +e
          firebase deploy --only "$only" --project accaza-sartoga --non-interactive --force
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Retry acknowledgement deploy::firebase deploy exited ${status}; waiting 60s for the Cloud Functions quota window to clear then retrying once."
            sleep 60
            firebase deploy --only "$only" --project accaza-sartoga --non-interactive --force
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # App Check enforcement is deliberately NOT configured here. A step's env: is shell
      # environment for the firebase CLI process only and is never forwarded into a deployed
      # function's runtime configuration, and functions/.env.accaza-sartoga is git-ignored so
      # it does not exist on this runner. The real lever is the committed default in
      # src/functions/00-app-check-flags.js - see APP_CHECK_ENFORCEMENT_RUNBOOK.md section 1.
      - name: Deploy Functions and rules
        run: |
          set +e
          firebase deploy --only functions,database,firestore,storage --project accaza-sartoga --non-interactive
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Retry functions and rules deploy::firebase deploy exited ${status}; the usual cause is a Cloud Functions mutation-quota straggler, so waiting 60s then retrying once."
            sleep 60
            firebase deploy --only functions,database,firestore,storage --project accaza-sartoga --non-interactive
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
