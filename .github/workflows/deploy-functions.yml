name: Deploy Firebase Functions & Rules

# Runs when functions/ OR the database/storage rules change.
# Static site files (admin.html / index.html / assets) still publish via Pages.
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "database.rules.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab too

permissions:
  contents: read

concurrency:
  group: accaza-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Both deploy steps can now retry once after a transient Cloud Functions API error.
    # The previous 25 minutes left no headroom for that, and a timeout kill in the middle
    # of a deploy is worse than a longer wait.
    timeout-minutes: 35
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root test dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install function dependencies
        working-directory: functions
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run Accaza quality gate
        run: npm run test:ci

      - name: Verify the default Firestore database exists
        run: |
          firebase firestore:databases:list --project accaza-sartoga --json > firestore-databases.json
          node -e "const x=require('./firestore-databases.json');if(!(x.result||[]).some(d=>String(d.name||'').endsWith('/databases/(default)')))throw new Error('Create the default Firestore database in asia-southeast1 before deployment.');"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Firebase requires an explicit acknowledgement when a function enables
      # retry-on-failure. Keep --force scoped to these named functions so the
      # full deployment cannot silently delete unrelated production functions.
      - name: Acknowledge retry policy for idempotent retry functions
        run: |
          only="functions:preservePostedOrderOnDelete,functions:replicateArchivedOrderToFirestore,functions:refreshHistoricalOrderAfterJournal,functions:refreshHistoricalOrderAfterInventoryPlan,functions:updateBooksMonthlyNet,functions:updateCashBalanceSummary,functions:updatePublicCatalogVersionOnCategories,functions:updatePublicCatalogVersionOnMenuItems,functions:updatePublicCatalogVersionOnOptionGroups,functions:updatePublicCatalogVersionOnPackages,functions:onShiftCloseAssurance,functions:syncUndepositedLedgerPageIndex,functions:syncPettyVoucherAttentionIndex,functions:mirrorPosMovementToBooks,functions:mirrorPosCogsToBooks,functions:onArchivedOrderInventoryReversal"
          # A transient Cloud Functions API error (HTTP 429 mutation quota, or an HTML error
          # page the CLI cannot parse as JSON) leaves one straggler function behind and fails
          # the run even though everything else deployed. Runs 411 and 412 both failed this way
          # with 176 of 177 functions already updated. One retry after the per-minute quota
          # window clears resolves it without anyone having to notice and click Re-run.
          #
          # PR #730 and PR #732 both failed the single-burst deploy with
          # "Quota exceeded for total allowable CPU per project per region" in asia-southeast1:
          # one --force pass over the ~50 retrying functions exceeded the region's Cloud Run CPU
          # quota while each revision health-checked. Deploy in small batches so each pass stays
          # under the burst limit; each batch still retries once after 60s.
          #
          # #739 attempt 1 hit the same quota in a 20-function batch, so the batch is smaller and
          # each pass now pauses before the next burst, letting the previous revisions finish
          # health-checking and release their CPU. The catalog-version triggers, which failed every
          # time, also cap maxInstances in code (src/functions/24-public-catalog-version.js).
          batch_size=6
          batch_pause=20
          deploy_batch() {
            local batch_list="$1"
            set +e
            firebase deploy --only "$batch_list" --project accaza-sartoga --non-interactive --force
            local batch_status=$?
            set -e
            if [ "$batch_status" -ne 0 ]; then
              echo "::warning title=Retry acknowledgement deploy::firebase deploy exited ${batch_status}; waiting 60s for the Cloud Functions quota window to clear then retrying once."
              sleep 60
              firebase deploy --only "$batch_list" --project accaza-sartoga --non-interactive --force
            fi
            sleep "$batch_pause"
          }
          batch=""
          count=0
          IFS=',' read -r -a fns <<< "$only"
          for fn in "${fns[@]}"; do
            if [ -n "$batch" ]; then batch="${batch},${fn}"; else batch="${fn}"; fi
            count=$((count + 1))
            if [ "$count" -ge "$batch_size" ]; then
              deploy_batch "$batch"
              batch=""
              count=0
            fi
          done
          if [ -n "$batch" ]; then deploy_batch "$batch"; fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Retire obsolete custody projection trigger
        run: |
          deployed_functions_json="$(mktemp)"
          trap 'rm -f "$deployed_functions_json"' EXIT
          firebase functions:list --project accaza-sartoga --json > "$deployed_functions_json"
          function_state="$(node -e 'const fs=require("node:fs");const doc=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(doc.status!=="success"||!Array.isArray(doc.result))throw new Error("Firebase functions:list returned an invalid response.");const matches=doc.result.filter(fn=>fn.id==="syncCashCustodyPageIndex"&&fn.region==="asia-southeast1");if(matches.length>1)throw new Error("More than one matching custody projection trigger was found.");process.stdout.write(matches.length?"present":"absent");' "$deployed_functions_json")"
          if [ "$function_state" = "present" ]; then
            firebase functions:delete syncCashCustodyPageIndex --region asia-southeast1 --project accaza-sartoga --force --non-interactive
          else
            echo "syncCashCustodyPageIndex is already absent; continuing."
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # 17 Oct 2026 Cloud Functions cost trim: the nightly backup is a full copy again, so the 34
      # per-record backup-marker triggers (markBackupDirty*) are retired, and the two loyalty order
      # triggers are retired until the loyalty program launches. While any of them is still present,
      # the full-copy backup is deployed first, so the old incremental backup never runs without its markers. Each retired trigger
      # still present is then deleted by exact name and region in small batches (the normal deploy
      # below runs without --force and stops on functions that are missing from the source).
      # 31 Oct 2026: the three /posActiveShift triggers (syncActiveRegisterCashFloat,
      # pruneClosedShiftOrders, syncPublicOrderStatus) are retired the same way. Their merged
      # replacement onPosActiveShiftWritten is deployed (and given two minutes to activate) before
      # they are deleted, so shift writes are never unhandled; a brief overlap is safe (float posting is claim-guarded and converges to the
      # live float, the status write is idempotent, and cleanup removes the orders it archives).
      - name: Retire cost-trimmed triggers
        run: |
          retired_triggers="onOrderLoyaltyEarning,onOrderDragonQuestProgress,markBackupDirtyArchivedOrders,markBackupDirtyInventoryMovements,markBackupDirtyOrderInventoryPlans,markBackupDirtyFinancialMovements,markBackupDirtyCashBalanceApplied,markBackupDirtyBooksJournal,markBackupDirtyShifts,markBackupDirtyOperationalAudit,markBackupDirtyFinancialCommandClaims,markBackupDirtyInventoryAccounting,markBackupDirtyFinancialApprovals,markBackupDirtyActivityLog,markBackupDirtyCfLedger,markBackupDirtyPettyCashReceipts,markBackupDirtyStockReceipts,markBackupDirtyPurchaseInvoices,markBackupDirtyPlatformPayouts,markBackupDirtyInternalUsage,markBackupDirtyInventoryAdjustments,markBackupDirtyPettyCashVouchers,markBackupDirtyPettyCashReplenishments,markBackupDirtyReceivables,markBackupDirtyPayables,markBackupDirtySuppliers,markBackupDirtyInventorySku,markBackupDirtyAppCustomers,markBackupDirtyReviews,markBackupDirtyFeedbacks,markBackupDirtyPackages,markBackupDirtyLoyaltyLedger,markBackupDirtyLoyaltyRewards,markBackupDirtyDragonQuestLedger,markBackupDirtyDragonQuestOrderIndex,markBackupDirtyArchivedQrTickets,syncActiveRegisterCashFloat,pruneClosedShiftOrders,syncPublicOrderStatus"
          deployed_list_json="$(mktemp)"
          trap 'rm -f "$deployed_list_json"' EXIT
          firebase functions:list --project accaza-sartoga --json > "$deployed_list_json"
          present="$(node -e 'const fs=require("node:fs");const doc=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(doc.status!=="success"||!Array.isArray(doc.result))throw new Error("Firebase functions:list returned an invalid response.");const wanted=new Set(process.argv[2].split(","));process.stdout.write(doc.result.filter(fn=>wanted.has(fn.id)&&fn.region==="asia-southeast1").map(fn=>fn.id).sort().join(" "));' "$deployed_list_json" "$retired_triggers")"
          if [ -z "$present" ]; then
            echo "All cost-trimmed triggers are already absent; continuing."
          else
            firebase deploy --only functions:backupDatabaseDaily,functions:runDatabaseBackupNow,functions:onPosActiveShiftWritten --project accaza-sartoga --non-interactive
            # A new database trigger can take about two minutes to become active; wait so no shift
            # write falls between the replacement going live and the old triggers being deleted.
            sleep 120
            read -r -a present_names <<< "$present"
            for ((i=0; i<${#present_names[@]}; i+=6)); do
              firebase functions:delete "${present_names[@]:i:6}" --region asia-southeast1 --project accaza-sartoga --force --non-interactive
              sleep 20
            done
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # App Check enforcement is deliberately NOT configured here. A step's env: is shell
      # environment for the firebase CLI process only and is never forwarded into a deployed
      # function's runtime configuration, and functions/.env.accaza-sartoga is git-ignored so
      # it does not exist on this runner. The real lever is the committed default in
      # src/functions/00-app-check-flags.js - see APP_CHECK_ENFORCEMENT_RUNBOOK.md section 1.
      - name: Deploy Functions and rules
        run: |
          set +e
          firebase deploy --only functions,database,firestore,storage --project accaza-sartoga --non-interactive
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Retry functions and rules deploy::firebase deploy exited ${status}; the usual cause is a Cloud Functions mutation-quota straggler, so waiting 60s then retrying once."
            sleep 60
            firebase deploy --only functions,database,firestore,storage --project accaza-sartoga --non-interactive
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
